        - heading "Extensions" [level=2] [ref=f17e47]
        - paragraph [ref=f17e48]:
          - text: Extensions are how an app shows up somewhere other than its own page — on a storefront, inline in Ratio admin, or at a URL under the merchant's own domain. There are four types today; configure them from an app's
          - link "Extensions tab" [ref=f17e49] [cursor=pointer]:
            - /url: app-detail.html
          - text: .
        - list [ref=f17e50]:
          - listitem [ref=f17e51]: Theme app block — UI the merchant drags into a specific spot on a storefront page in the theme editor.
          - listitem [ref=f17e52]: Theme app embed — UI or script that runs globally, once the merchant flips an on/off switch in Theme settings.
          - listitem [ref=f17e53]: App proxy — your own server, reachable at a URL under the merchant's own domain, with no CORS and no third-party cookie problem.
          - listitem [ref=f17e54]: Admin UI extension — an action, an inline card, or a print view rendered natively inside Ratio's merchant admin.
