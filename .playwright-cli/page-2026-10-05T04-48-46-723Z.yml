  - generic [ref=f17e13]:
    - text: Partner Terms of Service
    - paragraph [ref=f17e14]: Last updated September 1, 2026
    - heading "1. Agreement" [level=2] [ref=f17e15]
    - paragraph [ref=f17e16]: These terms govern your use of Ratio's partner program, developer tools, and APIs to build, list, and distribute apps that integrate with Ratio merchant stores. By creating an organisation, you accept these terms on behalf of yourself and anyone you grant access to.
    - heading "2. Your app and your data" [level=2] [ref=f17e17]
    - paragraph [ref=f17e18]: You own the apps you build. Ratio owns the platform, the scope model, and the review process that governs what your app may access. You may only request the scopes your app's functionality actually requires — merchants may narrow or deny any scope at install or at any later review.
    - heading "3. Review and listing" [level=2] [ref=f17e19]
    - paragraph [ref=f17e20]: Public listing in the app directory requires passing Ratio's quality review. Ratio may remove a listed app, or suspend an organisation's ability to publish, for violations including but not limited to requesting unused scopes, misrepresenting functionality, or unauthorized data retention after uninstall.
    - heading "4. Fees and payouts" [level=2] [ref=f17e21]
    - paragraph [ref=f17e22]:
      - text: Platform fees and any revenue you collect from merchants through Ratio's billing are described in
      - link "Pricing" [ref=f17e23] [cursor=pointer]:
        - /url: pricing.html
      - text: . Invoices and payout history are available under Settings → Billing once signed in.
    - heading "5. Collaborator and partner access" [level=2] [ref=f17e24]
    - paragraph [ref=f17e25]: Where a merchant grants your organisation collaborator access to their store, that access is scoped exactly to what the merchant approved and may be revoked by the merchant at any time. You may not request broader access through any channel other than the in-product request flow.
    - heading "6. Termination" [level=2] [ref=f17e26]
    - paragraph [ref=f17e27]: Either party may terminate this agreement at any time. On termination, Ratio revokes all of your organisation's API tokens and store access; published apps are delisted after a notice period to merchants who have them installed.
    - heading "7. Contact" [level=2] [ref=f17e28]
    - paragraph [ref=f17e29]:
      - text: Questions about these terms go to
      - link "partners@ratio.win" [ref=f17e30] [cursor=pointer]:
        - /url: mailto:partners@ratio.win
      - text: .
